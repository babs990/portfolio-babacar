<section id="example" class="pb-20 lg:pb-32" aria-labelledby="example-title">
  <div class="container-site">
    <h2
      id="example-title"
      class="text-center text-[clamp(1.75rem,2.78vw,2.5rem)] leading-tight font-bold text-ink"
    >
      {{ 'services.example.title' | translate }}
    </h2>

    <p class="mx-auto mt-8 max-w-[57rem] text-base leading-[1.7] text-ink lg:mt-12">
      {{ 'services.example.text' | translate }}
    </p>

    <!-- Journey: persona → sketches → final screens -->
    <ol
      class="journey mt-14 lg:mt-28"
      [attr.aria-label]="'services.example.stepsLabel' | translate"
    >
      <li class="journey__step journey__step--persona">
        <img
          class="h-auto w-full"
          ngSrc="assets/images/services/example-persona.webp"
          width="547"
          height="972"
          [alt]="'services.example.personaAlt' | translate"
        />
      </li>

      <li class="journey__arrow" aria-hidden="true">
        <svg viewBox="0 0 76 40" fill="none">
          <path d="M3 30C22 6 48 4 70 22" />
          <path d="m62 23 8-1-3-7" />
        </svg>
      </li>

      <li class="journey__step journey__step--sketches">
        <img
          class="h-auto w-full"
          ngSrc="assets/images/services/example-sketches.webp"
          width="705"
          height="580"
          [alt]="'services.example.sketchesAlt' | translate"
        />
      </li>

      <li class="journey__arrow" aria-hidden="true">
        <svg viewBox="0 0 76 40" fill="none">
          <path d="M3 30C22 6 48 4 70 22" />
          <path d="m62 23 8-1-3-7" />
        </svg>
      </li>

      <li class="journey__step journey__step--screens">
        <img
          class="h-auto w-full"
          ngSrc="assets/images/services/example-screens.webp"
          width="787"
          height="767"
          [alt]="'services.example.screensAlt' | translate"
        />
      </li>
    </ol>
  </div>
</section>
