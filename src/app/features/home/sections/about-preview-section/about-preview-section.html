<section id="about-preview" class="py-16 lg:py-32" aria-labelledby="about-preview-title">
  <div class="container-site">
    <div
      class="mx-auto grid max-w-[70.25rem] items-center gap-10 lg:grid-cols-[21.4375rem_minmax(0,1fr)] lg:gap-[4.3125rem]"
    >
      <!-- Portrait: rounded frame + dashed outline are part of the image -->
      <img
        class="about__portrait mx-auto h-auto w-full max-w-[21.4375rem]"
        ngSrc="assets/images/about-portrait.webp"
        width="765"
        height="1005"
        [alt]="'home.aboutPreview.photoAlt' | translate"
      />

      <div class="flex flex-col">
        <h2
          id="about-preview-title"
          class="text-[clamp(1.75rem,2.78vw,2.5rem)] leading-tight font-bold text-heading"
        >
          {{ 'hero.name' | translate }}
        </h2>

        <p class="mt-5 text-base leading-[1.65] text-ink">
          {{ 'home.aboutPreview.text' | translate }}
        </p>

        <a appButton routerLink="/about" class="mt-6 self-center">
          {{ 'common.seeMore' | translate }}
          <svg class="size-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M3 8h10m0 0L9 4m4 4-4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>
